services:
  - type: web
    name: socs-backend
    runtime: rust
    plan: free
    buildCommand: cargo build --release
    startCommand: ./target/release/socs-backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socs-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 604800
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: RUST_LOG
        value: info
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SQLX_OFFLINE
        value: true

databases:
  - name: socs-db
    databaseName: socs
    plan: free
    user: socs
